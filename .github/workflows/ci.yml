name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/platform-api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./data/test.db
          ALLOW_PRODUCTION_MUTATIONS: "false"
          JWT_SECRET: test-secret-000000000000000000000
          BOOTSTRAP_ADMIN_USERNAME: admin
          BOOTSTRAP_ADMIN_PASSWORD: test-admin-password

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: pnpm
          cache-dependency-path: apps/admin-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:staging

  api-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production API image
        run: docker build -t seiwajyuku-platform-api:ci apps/platform-api
