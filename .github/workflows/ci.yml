name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/platform-api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./data/test.db
          ALLOW_PRODUCTION_MUTATIONS: "false"
          JWT_SECRET: test-secret-000000000000000000000
          BOOTSTRAP_ADMIN_USERNAME: admin
          BOOTSTRAP_ADMIN_PASSWORD: test-admin-password

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: pnpm
          cache-dependency-path: apps/admin-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node --test tests/study-meeting-error.test.mjs
      - run: pnpm build:staging

  wechat-miniprogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
      - name: Check TEST mini-program configuration and source syntax
        run: node scripts/check_wechat_miniprogram.mjs
        env:
          MINIPROGRAM_EXPECTED_APPID: wxb63212d3ce337b81
      - name: Multi-course photo and retry interaction tests
        run: node --test scripts/test_study_meeting_miniprogram.mjs scripts/test_home_identity_miniprogram.mjs scripts/test_miniprogram_portal.mjs

  cloud-function-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
      - name: Check protected study-evidence cleanup function
        run: |
          node -e 'const fs = require("fs"); const c = JSON.parse(fs.readFileSync("cloudbaserc.json", "utf8")); const f = (c.functions || []).find(item => item.name === "studyEvidenceCleanup"); if (c.version !== "2.1" || !f || f.dir !== "cloudfunctions/study-evidence-cleanup" || f.triggers?.[0]?.type !== "timer") process.exit(1); if (JSON.stringify(f).includes("STUDY_EVIDENCE_CLEANUP_TOKEN")) process.exit(1);'
          node --check cloudfunctions/study-evidence-cleanup/index.js
          node --test cloudfunctions/study-evidence-cleanup/index.test.mjs

  api-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify clean source checkout
        run: |
          python scripts/build_provenance.py verify \
            --expected-commit "$GITHUB_SHA" \
            --migration-manifest docs/V1.2-R1.1-migration-manifest-20260828.json
          echo "APP_BUILD_TIME_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build production API image (root Dockerfile with migrations)
        run: |
          docker build \
            --build-arg APP_GIT_SHA="$GITHUB_SHA" \
            --build-arg APP_BUILD_TIME_UTC="$APP_BUILD_TIME_UTC" \
            --build-arg APP_VERSION="ci-${GITHUB_SHA:0:12}" \
            --build-arg APP_BUILD_ID="$GITHUB_RUN_ID" \
            --build-arg APP_IMAGE_DIGEST="unknown" \
            -t seiwajyuku-platform-api:ci .
      - name: Verify OCI labels and runtime build info
        run: |
          set -euo pipefail
          test "$(docker image inspect seiwajyuku-platform-api:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect seiwajyuku-platform-api:ci --format '{{ index .Config.Labels "org.opencontainers.image.created" }}')" = "$APP_BUILD_TIME_UTC"
          test "$(docker image inspect seiwajyuku-platform-api:ci --format '{{ index .Config.Labels "com.seiwajyuku.build.id" }}')" = "$GITHUB_RUN_ID"
          trap 'docker rm -f api-provenance >/dev/null 2>&1 || true' EXIT
          docker run --detach --name api-provenance --publish 18000:8000 \
            --env APP_ENV=test \
            --env DATABASE_URL=sqlite:////app/data/provenance-test.db \
            --env DEPLOYMENT_READ_ONLY=true \
            --env RUN_BOOTSTRAP_ON_STARTUP=false \
            seiwajyuku-platform-api:ci >/dev/null
          for attempt in $(seq 1 30); do
            if body="$(curl --silent --show-error --fail http://127.0.0.1:18000/api/v1/system/build-info)"; then
              BUILD_SHA="$GITHUB_SHA" BUILD_ID="$GITHUB_RUN_ID" BUILD_VERSION="ci-${GITHUB_SHA:0:12}" BUILD_TIME="$APP_BUILD_TIME_UTC" BODY="$body" \
                python -c 'import json, os; p=json.loads(os.environ["BODY"]); assert p["commit_sha"] == os.environ["BUILD_SHA"]; assert p["build_id"] == os.environ["BUILD_ID"]; assert p["version"] == os.environ["BUILD_VERSION"]; assert p["build_time_utc"] == os.environ["BUILD_TIME"]; assert p["environment"] == "test"; assert set(p) == {"version", "commit_sha", "build_time_utc", "build_id", "image_digest", "environment"}'
              exit 0
            fi
            sleep 1
          done
          docker logs api-provenance
          exit 1

  study-meeting-mysql:
    # Disposable, isolated CI database. No production credentials or deployment.
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-b21-root
          MYSQL_DATABASE: seiwajyuku_b21_test
          MYSQL_USER: b21_test
          MYSQL_PASSWORD: ci-b21-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-b21-root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://b21_test:ci-b21-password@127.0.0.1:3306/seiwajyuku_b21_test?charset=utf8mb4
      ALLOW_PRODUCTION_MUTATIONS: "false"
      BOOTSTRAP_ADMIN_PASSWORD: test-admin-password
      PYTHONPATH: apps/platform-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r apps/platform-api/requirements.txt
      - name: MySQL photo, course, binding and capability integration
        run: >-
          python -m pytest apps/platform-api/tests/test_study_meeting_evidence.py
          apps/platform-api/tests/test_v12_mvp.py
          apps/platform-api/tests/test_volunteer_position_model.py
          apps/platform-api/tests/test_study_meeting_attendees.py
          -q --junitxml=b21-mysql.xml
      - name: Verify 0042 guarded rollback on disposable test data
        run: |
          if docker exec -i "${{ job.services.mysql.id }}" mysql -uroot -pci-b21-root seiwajyuku_b21_test < migrations/rollback/mysql/0042_study_meeting_attendee_correction.down.sql; then
            echo "ERROR: downgrade must refuse existing operator-added facts"
            exit 1
          fi
          originals="$(docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -pci-b21-root seiwajyuku_b21_test -e "SELECT COUNT(*) FROM study_meeting_attendances WHERE added_by_user_id IS NULL;")"
          # Test-owned disposable CI database only: remove generated operator fixtures to test safe downgrade.
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -pci-b21-root seiwajyuku_b21_test -e "DELETE FROM study_meeting_attendances WHERE added_by_user_id IS NOT NULL;"
          docker exec -i "${{ job.services.mysql.id }}" mysql -uroot -pci-b21-root seiwajyuku_b21_test < migrations/rollback/mysql/0042_study_meeting_attendee_correction.down.sql
          remaining="$(docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -pci-b21-root seiwajyuku_b21_test -e "SELECT COUNT(*) FROM study_meeting_attendances;")"
          test "$originals" = "$remaining"
          removed="$(docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -pci-b21-root seiwajyuku_b21_test -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='study_meeting_attendances' AND column_name='added_by_user_id';")"
          test "$removed" = "0"
      - name: Verify 0041 rollback on disposable test data
        run: |
          docker exec -i "${{ job.services.mysql.id }}" mysql -uroot -pci-b21-root seiwajyuku_b21_test < migrations/rollback/mysql/0041_study_meeting_courses_evidence.down.sql
          result="$(docker exec "${{ job.services.mysql.id }}" mysql -N -uroot -pci-b21-root seiwajyuku_b21_test -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN ('study_meeting_courses','study_meeting_evidence');")"
          test "$result" = "0"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b21-mysql-results
          path: b21-mysql.xml

  mysql-staging:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: seiwajyuku_staging
          MYSQL_USER: seiwajyuku
          MYSQL_PASSWORD: ci-staging-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: staging
      DATABASE_URL: mysql+pymysql://seiwajyuku:ci-staging-password@127.0.0.1:3306/seiwajyuku_staging?charset=utf8mb4
      JWT_SECRET: ci-staging-jwt-secret-000000000000
      FIELD_ENCRYPTION_KEY: ci-staging-field-key
      DEPLOYMENT_READ_ONLY: "false"
      ALLOW_PRODUCTION_MUTATIONS: "false"
      IDENTITY_AUTHORIZATION_ENABLED: "true"
      VOLUNTEER_SERVICE_INVITATIONS_ENABLED: "true"
      PYTHONPATH: apps/platform-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/platform-api/requirements.txt
      - run: pip install -r apps/platform-api/requirements.txt
      - name: Run real MySQL migrations, backfill and attendance validation
        run: python scripts/validate_staging_mysql.py
      - name: Dump staging database
        run: >-
          docker exec "${{ job.services.mysql.id }}"
          mysqldump -uroot -pci-root-password
          --single-transaction --routines --triggers
          seiwajyuku_staging > staging-backup.sql
      - name: Restore into an empty database
        run: |
          docker exec "${{ job.services.mysql.id }}" \
            mysql -uroot -pci-root-password \
            -e "CREATE DATABASE seiwajyuku_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          docker exec -i "${{ job.services.mysql.id }}" \
            mysql -uroot -pci-root-password seiwajyuku_restore < staging-backup.sql
      - name: Verify restored schema and row counts
        run: |
          source_counts="$(docker exec "${{ job.services.mysql.id }}" \
            mysql -N -uroot -pci-root-password seiwajyuku_staging \
            -e "SELECT CONCAT((SELECT COUNT(*) FROM schema_migrations),':',(SELECT COUNT(*) FROM member_org_relations),':',(SELECT COUNT(*) FROM attendance_score_records),':',(SELECT COUNT(*) FROM operating_institutions));")"
          restore_counts="$(docker exec "${{ job.services.mysql.id }}" \
            mysql -N -uroot -pci-root-password seiwajyuku_restore \
            -e "SELECT CONCAT((SELECT COUNT(*) FROM schema_migrations),':',(SELECT COUNT(*) FROM member_org_relations),':',(SELECT COUNT(*) FROM attendance_score_records),':',(SELECT COUNT(*) FROM operating_institutions));")"
          expected_migration_count="$(find migrations/mysql -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          test "$source_counts" = "${expected_migration_count}:4:3:4"
          test "$restore_counts" = "$source_counts"
      - name: Verify MySQL rollback preserves legacy data
        run: |
          for rollback in \
            migrations/rollback/mysql/0020_member_company_headcount_and_tenure_override.down.sql \
            migrations/rollback/mysql/0019_member_service_signal_feedback.down.sql \
            migrations/rollback/mysql/0018_legacy_member_activity_facts.down.sql \
            migrations/rollback/mysql/0017_member_merge_history.down.sql \
            migrations/rollback/mysql/0016_member_change_history.down.sql \
            migrations/rollback/mysql/0015_member_phone_unique.down.sql \
            migrations/rollback/mysql/0014_renewal_preview_privacy.down.sql \
            migrations/rollback/mysql/0013_identity_multi_position_compat.down.sql \
            migrations/rollback/mysql/0012_followup_service_invitations.down.sql \
            migrations/rollback/mysql/0011_identity_appointments.down.sql; do
            docker exec -i "${{ job.services.mysql.id }}" \
              mysql -uroot -pci-root-password seiwajyuku_restore < "$rollback"
          done
          new_tables="$(docker exec "${{ job.services.mysql.id }}" \
            mysql -N -uroot -pci-root-password seiwajyuku_restore \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN ('operating_institutions','person_profiles','account_person_links','operations_employments','operations_position_assignments','employee_service_responsibilities','volunteer_appointments','technical_admin_assignments','followup_service_invitations','followup_collaborators','member_change_history','member_merge_history','member_activity_facts','member_service_signal_feedback');")"
          legacy_tables="$(docker exec "${{ job.services.mysql.id }}" \
            mysql -N -uroot -pci-root-password seiwajyuku_restore \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN ('members','member_org_relations','attendance_records','attendance_score_records','followup_tasks','audit_logs');")"
          renewal_columns="$(docker exec "${{ job.services.mysql.id }}" \
            mysql -N -uroot -pci-root-password seiwajyuku_restore \
            -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND ((table_name='renewal_import_batches' AND column_name='preview_ciphertext') OR (table_name='renewal_import_staging' AND column_name IN ('history_note_ciphertext','assistance_note_ciphertext','raw_json_ciphertext')));")"
          phone_index="$(docker exec "${{ job.services.mysql.id }}" \
            mysql -N -uroot -pci-root-password seiwajyuku_restore \
            -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name='members' AND index_name='uq_members_phone_hash';")"
          legacy_counts="$(docker exec "${{ job.services.mysql.id }}" \
            mysql -N -uroot -pci-root-password seiwajyuku_restore \
            -e "SELECT CONCAT((SELECT COUNT(*) FROM member_org_relations),':',(SELECT COUNT(*) FROM attendance_score_records));")"
          test "$new_tables" = "0"
          test "$legacy_tables" = "6"
          test "$renewal_columns" = "0"
          test "$phone_index" = "0"
          test "$legacy_counts" = "4:3"

  build-provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - api
      - admin-web
      - wechat-miniprogram
      - cloud-function-cleanup
      - api-container
      - study-meeting-mysql
      - mysql-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify pushed main and create release manifest
        run: |
          set -euo pipefail
          python scripts/build_provenance.py verify \
            --expected-commit "$GITHUB_SHA" \
            --require-origin-main \
            --migration-manifest docs/V1.2-R1.1-migration-manifest-20260828.json
          mkdir -p artifacts
          python scripts/build_provenance.py manifest \
            --output artifacts/release-manifest.json \
            --expected-commit "$GITHUB_SHA" \
            --require-origin-main \
            --version "ci-${GITHUB_SHA:0:12}" \
            --environment ci \
            --build-id "$GITHUB_RUN_ID" \
            --ci-run "$GITHUB_RUN_ID" \
            --ci-conclusion success \
            --image-tag "seiwajyuku-platform-api:ci" \
            --migration-manifest docs/V1.2-R1.1-migration-manifest-20260828.json \
            --migration-state '{"status":"ci-validated"}' \
            --feature-flags '{"production":false,"v12":false}'
          python scripts/build_provenance.py validate artifacts/release-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-provenance-${{ github.run_id }}
          path: artifacts/release-manifest.json
