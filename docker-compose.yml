name: seiwajyuku-platform

services:
  api-dev:
    profiles: ["dev"]
    build:
      context: ./apps/platform-api
    env_file:
      - .env
    environment:
      APP_ENV: dev
      DATABASE_URL: sqlite:////app/data/seiwajyuku_dev.db
      ALLOW_PRODUCTION_MUTATIONS: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    profiles: ["staging"]
    image: mysql:8.4
    env_file:
      - .env
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - staging_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  api-staging:
    profiles: ["staging"]
    build:
      context: .
      dockerfile: Dockerfile.staging
    env_file:
      - .env
    environment:
      APP_ENV: staging
      ALLOW_PRODUCTION_MUTATIONS: "false"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8001:8000"

volumes:
  staging_mysql:
